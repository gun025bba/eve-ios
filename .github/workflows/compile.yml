name: compile
# Compile verification for pull requests only: no signing, no artifacts, no attestation, no secrets.
# Security review: `pull_request` (never pull_request_target), read-only token, actions pinned to SHAs.
# The release/IPA pipeline stays in build-ipa.yml (push to main / manual dispatch only).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Source leak check (counts only, never prints matches; fail-closed)
        run: |
          set -euo pipefail
          # Written so that the pattern text does not match itself (e.g. [.]ts[.]net), because every tracked file
          # including .github/workflows is scanned. Covers Tailscale names/ranges, RFC1918 + link-local IPs and mDNS-style local names.
          PAT='[.]ts[.]net|[.]loca[l]($|[^A-Za-z0-9_-])|fd7a:115c:a1e[0]:'
          PAT="$PAT|(^|[^0-9.])100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.][0-9]+[.][0-9]+"
          PAT="$PAT|(^|[^0-9.])10[.][0-9]+[.][0-9]+[.][0-9]+"
          PAT="$PAT|(^|[^0-9.])172[.](1[6-9]|2[0-9]|3[01])[.][0-9]+[.][0-9]+"
          PAT="$PAT|(^|[^0-9.])(192[.]168|169[.]254)[.][0-9]+[.][0-9]+"
          # Self-test of the pattern (samples are split so they do not match themselves in this file).
          for s in "x.ts"".net" "h.loc""al" "10.1.""2.3" "192.168.""1.5" "172.2""0.0.1" "100.6""4.1.1" "169.254.""1.1" "fd7a:115c:a1e""0::1"; do
            printf '%s\n' "$s" | grep -Eq "$PAT" || { echo "::error::leak pattern self-test failed (positive)"; exit 1; }
          done
          for s in "1.10.2.3.4" "100.128.0.1" "172.15.0.1" "192.169.1.1" "Local.xcconfig" "example.invalid"; do
            if printf '%s\n' "$s" | grep -Eq "$PAT"; then echo "::error::leak pattern self-test failed (negative)"; exit 1; fi
          done
          [ "$(git ls-files | wc -l)" -gt 0 ] || { echo "::error::no tracked files"; exit 1; }
          rc=0
          git grep -qIE "$PAT" -- . || rc=$?
          case "$rc" in
            0) echo "::error::tracked files contain a forbidden address pattern (matches not printed)"; exit 1 ;;
            1) echo "no forbidden address patterns in tracked files" ;;
            *) echo "::error::git grep failed (exit $rc)"; exit 1 ;;
          esac

      - name: Select Xcode 26.x
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install pinned XcodeGen (release zip + sha256)
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          rm xcodegen.zip

      - name: Verify Config/Local.xcconfig overrides the committed defaults (resolved build settings)
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^EVE_SHELL_VERSION = //p' Config/Base.xcconfig)
          BLD=$(sed -n 's/^EVE_BUILD_NUMBER = //p' Config/Base.xcconfig)
          [ -n "$VER" ] && [ -n "$BLD" ] || { echo "::error::version or build number missing in Config/Base.xcconfig"; exit 1; }
          grep -q "shellVersion = \"$VER\"" Eve/ShellConfig.swift || { echo "::error::ShellConfig.shellVersion differs from EVE_SHELL_VERSION ($VER)"; exit 1; }
          # 1) fresh clone, no Local.xcconfig: placeholders (the optional include must not break anything)
          rm -f Config/Local.xcconfig
          scripts/check-config.sh PRODUCT_BUNDLE_IDENTIFIER=com.example.eve DEVELOPMENT_TEAM= EVE_HOST=eve.example.invalid \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BLD"
          # 2) Local.xcconfig with its own values: every one of them must reach the Eve target's build settings
          printf '%s\n' 'EVE_HOST = override.example.invalid' 'EVE_BUNDLE_ID = ci.example.override' 'DEVELOPMENT_TEAM = ABCDE12345' > Config/Local.xcconfig
          scripts/check-config.sh PRODUCT_BUNDLE_IDENTIFIER=ci.example.override DEVELOPMENT_TEAM=ABCDE12345 EVE_HOST=override.example.invalid \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BLD"
          # 3) Local.xcconfig may also set the final build setting directly: it still wins over the derived value
          printf '%s\n' 'EVE_BUNDLE_ID = ci.example.ignored' 'PRODUCT_BUNDLE_IDENTIFIER = ci.example.direct' > Config/Local.xcconfig
          scripts/check-config.sh PRODUCT_BUNDLE_IDENTIFIER=ci.example.direct
          rm -f Config/Local.xcconfig

      - name: setup-local.sh refuses control characters and writes nothing (macOS bash)
        run: |
          set -uo pipefail
          rm -f Config/Local.xcconfig
          nl=$'\n'
          ok=1
          # each of these must exit 2 and must not create Config/Local.xcconfig
          chk() { scripts/setup-local.sh "$@" >/dev/null 2>&1; rc=$?; if [ "$rc" -ne 2 ] || [ -e Config/Local.xcconfig ]; then echo "::error::setup-local.sh did not refuse (rc=$rc)"; ok=0; fi; rm -f Config/Local.xcconfig; }
          chk --host "good.example${nl}EVE_BUNDLE_ID = evil.example" --bundle-id com.example.eve --team ABCDE12345
          chk --host good.example --bundle-id "com.example.eve${nl}DEVELOPMENT_TEAM = ZZZZZZZZZZ" --team ABCDE12345
          chk --host good.example --bundle-id com.example.eve --team "ABCDE12345${nl}X = 1"
          chk --host "good.example$(printf '\r')" --bundle-id com.example.eve --team ABCDE12345
          chk --host "good.example$(printf '\t')" --bundle-id com.example.eve --team ABCDE12345
          chk --host good.example --bundle-id com.example.eve --team abcde12345
          [ "$ok" -eq 1 ]

      - name: Generate project (placeholder host, no real address)
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          sed -i '' 's/^EVE_HOST = .*/EVE_HOST = eve.example.invalid/' Config/Local.xcconfig
          grep -q '^EVE_HOST = eve.example.invalid$' Config/Local.xcconfig || { echo "::error::placeholder substitution failed"; exit 1; }
          xcodegen generate

      - name: Compile (unsigned, build only)
        run: |
          set -o pipefail
          xcodebuild -project Eve.xcodeproj -scheme Eve -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -n 200

      - name: Unit tests (pure logic; macOS, ad-hoc signed, no simulator, no secrets)
        run: |
          set -o pipefail
          xcodebuild test -project Eve.xcodeproj -scheme EveLogicTests \
            -destination 'platform=macOS' \
            -derivedDataPath build-tests \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" | tail -n 120
