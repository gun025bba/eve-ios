name: Eve
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# One xcconfig (Base defaults, derived settings, then the gitignored Local.xcconfig last) at project AND target level.
# Do not put PRODUCT_BUNDLE_IDENTIFIER / MARKETING_VERSION / CURRENT_PROJECT_VERSION / DEVELOPMENT_TEAM into `settings`
# below: target build settings win over any xcconfig and would silently ignore Config/Local.xcconfig.
configFiles:
  Debug: Config/Shell.xcconfig
  Release: Config/Shell.xcconfig
targets:
  Eve:
    type: application
    platform: iOS
    sources: [Eve]
    configFiles:
      Debug: Config/Shell.xcconfig
      Release: Config/Shell.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Eve/Info.plist
      properties:
        CFBundleDisplayName: Eve
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EveHost: $(EVE_HOST)
        EveStartPath: $(EVE_START_PATH)
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  # Pure-logic unit tests (RevokePolicy / PendingList / notify validation + scheduler). Compiled without the app so they run on the macOS runner
  # with no simulator and no signing; the shared source file has no UIKit/Security/WebKit dependencies.
  EveLogicTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests/EveLogicTests
      - Eve/RevokePolicy.swift
      - Eve/NotificationValidation.swift
      - Eve/NotificationScheduler.swift
      - Eve/SessionBackupPolicy.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: invalid.example.EveLogicTests
schemes:
  EveLogicTests:
    build:
      targets:
        EveLogicTests: all
    test:
      targets:
        - EveLogicTests
